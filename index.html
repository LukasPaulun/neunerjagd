<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Der Stammtisch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@800&family=Alegreya+Sans:wght@400;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
/* Layout: Handy-Hochformat – schmale Spalte, Spielfeld mit festem 9:16-Seitenverhältnis */
:root{
  --paper:#eef0ec; --surface:#f8f9f6; --ink:#1b1c1e; --muted:#5b625d; --line:#d3d8d0;
  --chestnut:#8c3b1f; --thorn:#3e5c33; --gold:#a8830f; --ok:#2f6b3a; --bad:#a3291c;
  --veil:rgba(248,249,246,.92);
  --f-display:"Grenze Gotisch",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141719; --surface:#1c2023; --ink:#ebe8e1; --muted:#9ca39f; --line:#2f3539;
  --chestnut:#d5764f; --thorn:#8fb27c; --gold:#e0bd4f; --ok:#7cc48a; --bad:#ef7b6c; --veil:rgba(28,32,35,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141719; --surface:#1c2023; --ink:#ebe8e1; --muted:#9ca39f; --line:#2f3539;
  --chestnut:#d5764f; --thorn:#8fb27c; --gold:#e0bd4f; --ok:#7cc48a; --bad:#ef7b6c; --veil:rgba(28,32,35,.92); color-scheme:dark}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  min-height:calc(100vh - 30px);min-height:calc(100svh - max(10px,env(safe-area-inset-top,0px)) - max(20px,env(safe-area-inset-bottom,0px)))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-height:34px}
h1{min-width:0;font-family:var(--f-display);font-weight:800;margin:0;line-height:1;font-size:34px;color:var(--chestnut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;white-space:nowrap}
.back{align-self:center;flex:none;position:relative;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.back::after{content:"";position:absolute;inset:-8px -4px}
/* Kopfzeile rechts: Vereinszeile bzw. Zurück-Knopf, daneben der Lautsprecher (Tonmodus) */
.hdr-r{position:relative;flex:none;align-self:center;display:flex;align-items:center;gap:8px}
.ton{position:relative;flex:none;width:34px;height:34px;display:grid;place-items:center;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:50%;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ton::after{content:"";position:absolute;inset:-6px}
.ton svg{width:19px;height:19px;display:block}
.ton[data-mode="an"]{color:var(--chestnut)}
.ton-lbl{position:absolute;right:42px;top:50%;transform:translateY(-50%);z-index:5;white-space:nowrap;pointer-events:none;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 9px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
@media (max-width:430px){
  h1{font-size:clamp(24px,7.6vw,34px)}
  .eyebrow{display:none}
  .back{padding:7px 9px;letter-spacing:.03em}
}
.stage{position:relative;flex:none;container-type:size;width:100%;width:min(100%,calc((100vh - 88px) * 9 / 16));width:min(100%,calc((100svh - 88px) * 9 / 16));margin:auto;aspect-ratio:9/16;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* Overlay: Schrift skaliert mit der Bühne (Container-Einheiten, Bühne 360 Welt-Einheiten breit),
   der Textblock darf schrumpfen und scrollen, Titel und Knopf bleiben immer sichtbar. */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:14px;gap:clamp(7px,2.2cqh,14px);
  text-align:center;padding:28px;padding:clamp(12px,4.4cqh,28px) clamp(14px,7cqi,28px);background:var(--veil);overflow:hidden}
.overlay h2{flex:none;max-width:100%;font-family:var(--f-display);font-size:44px;font-size:clamp(24px,min(12.2cqi,6.9cqh),44px);margin:0;color:var(--chestnut);font-weight:800;line-height:1.05;text-wrap:balance;overflow-wrap:break-word}
.ov-text{flex:0 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;gap:clamp(6px,2.2cqh,14px);-webkit-overflow-scrolling:touch}
.overlay p{margin:0;max-width:32ch;text-wrap:pretty}
#ov-p{font-size:16px;font-size:clamp(13px,min(4.45cqi,2.6cqh),16px)}
.rules{font-size:14px;color:var(--muted);text-wrap:balance}
.overlay .rules{font-size:clamp(11.5px,min(3.9cqi,2.25cqh),14px)}
.big{background:var(--chestnut);color:#fff;border:0;padding:14px 30px;border-radius:999px;font:700 19px var(--f-body);cursor:pointer;touch-action:manipulation;transition:opacity .35s}
.overlay .big{flex:none;font-size:clamp(16px,min(5.3cqi,3cqh),19px);padding:clamp(10px,2.2cqh,14px) clamp(20px,8.3cqi,30px)}
.big:disabled{opacity:0;pointer-events:none;transition:none}
.best{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.overlay .best{flex:none;font-size:clamp(10.5px,3.3cqi,12px)}
.pause{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-mono);cursor:pointer;touch-action:manipulation}
/* Listen-Menü (#/liste) */
.menu{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:26px 22px 150px;overflow:hidden}
.menu-head{text-align:center}
.menu-head h2{font-family:var(--f-display);font-size:40px;margin:0 0 6px;color:var(--chestnut);font-weight:800;line-height:1.05}
.menu-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.menu-item{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name station" "best best";gap:2px 10px;min-height:56px;padding:9px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--veil);color:var(--ink);text-decoration:none;touch-action:manipulation}
.menu-item.from{border-color:var(--chestnut)}
.mi-name{grid-area:name;font-weight:700;font-size:19px;line-height:1.2}
.mi-station{grid-area:station;align-self:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mi-best{grid-area:best;font-family:var(--f-mono);font-size:12px;color:var(--chestnut)}
/* Oberwelt (Hub): Container lässt Tipps zum Canvas durch, nur Karte/Panel/Link sind bedienbar */
.ow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ow-liste{pointer-events:auto;position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  text-decoration:none;background:var(--veil);border:1px solid var(--line);border-radius:999px;padding:6px 11px;touch-action:manipulation}
.ow-liste::after{content:"";position:absolute;inset:-10px -6px}
.ow-hint{pointer-events:auto;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;align-items:center;gap:4px;
  font-size:13px;line-height:1.3;color:var(--ink);background:var(--veil);border:1px solid var(--line);border-radius:12px;padding:6px 4px 6px 11px;box-shadow:0 4px 14px rgba(0,0,0,.12);animation:owFade 1s ease-out}
.ow-hint-txt{min-width:0;text-wrap:balance}
.ow-hint-x{flex:none;width:30px;height:30px;border:0;background:none;color:var(--muted);font:600 18px var(--f-body);cursor:pointer;touch-action:manipulation;padding:0}
.ow-card{pointer-events:auto;position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;
  background:var(--veil);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.18);animation:owUp .2s ease-out}
.ow-card-txt{flex:1;min-width:0}
.ow-card-k{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ow-card h3{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;margin:2px 0 3px;color:var(--chestnut)}
.ow-card-best{font-family:var(--f-mono);font-size:11.5px;color:var(--ink)}
.ow-card .big{flex:none;padding:13px 20px;font-size:18px;min-height:48px}
.ow-panel{pointer-events:auto;position:absolute;inset:10px;display:flex;flex-direction:column;gap:12px;padding:20px 16px 16px;container-type:inline-size;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.22);overflow:auto;animation:owUp .2s ease-out}
.ow-panel-head{text-align:center}
.ow-panel h2{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.05;margin:0 0 4px;color:var(--chestnut)}
.ow-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ow-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.ow-row-name{font-weight:700;font-size:17px;line-height:1.2}
.ow-row-station,.ow-row-title{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ow-row-r{text-align:right}
.ow-row-score{font-family:var(--f-mono);font-size:20px;color:var(--chestnut);line-height:1.1}
.ow-row.leer .ow-row-score{color:var(--muted)}
.ow-row-title{color:var(--chestnut);text-transform:none;letter-spacing:0;font-size:11px}
.ow-row.leer .ow-row-title{color:var(--muted)}
.ow-close{align-self:center;margin-top:auto;flex:none}
.ow-panel-x{position:sticky;top:-12px;align-self:flex-end;margin:-12px -6px -44px 0;z-index:2;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font:600 22px/1 var(--f-body);cursor:pointer;touch-action:manipulation;padding:0}
.ow-credits{font-size:11px;line-height:1.35;color:var(--muted);text-align:center;flex:none}
@media (max-height:700px){.ow-panel{gap:8px;padding:14px 12px 12px}.ow-panel h2{font-size:32px}.ow-panel .rules{font-size:12.5px}.ow-rows{gap:5px}.ow-row{padding:6px 10px}.ow-row-name{font-size:15px}.ow-row-score{font-size:17px}.ow-close{padding:10px 24px;font-size:17px}}
@keyframes owUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes owFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ow-card,.ow-panel,.ow-hint{animation:none}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* Querformat auf Touch-Geräten: Bitte hochkant halten (main.js zeigt es und pausiert das Spiel) */
.quer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:var(--paper);color:var(--ink);text-align:center}
.quer svg{width:64px;height:64px;color:var(--chestnut);animation:querDreh 2.4s ease-in-out infinite}
.quer p{margin:0;font-size:19px;font-weight:700;max-width:24ch}
.quer small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@keyframes querDreh{0%,20%{transform:rotate(-90deg)}55%,100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.quer svg{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Der Stammtisch</h1>
    <div class="hdr-r">
      <span class="eyebrow" id="eyebrow">Stammtisch n.e.v.</span>
      <a class="back" id="back" href="#/" hidden>‹ Stammtisch</a>
      <button class="ton" id="ton" type="button" aria-label="Ton: alles an. Tippen für: nur Effekte"></button>
      <span class="ton-lbl" id="ton-lbl" aria-live="polite" hidden></span>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Spielfeld"></canvas>
    <div id="hub" hidden></div>
    <button class="pause" id="pauseB" type="button" aria-label="Pause" hidden>II</button>
    <div class="overlay" id="ov">
      <h2 id="ov-t">Der Stammtisch</h2>
      <div class="ov-text">
        <p id="ov-p"></p>
        <p class="rules" id="ov-r" hidden></p>
      </div>
      <button class="big" id="start" type="button">Start</button>
      <p class="best" id="best">Falls diese Zeile stehen bleibt, läuft das Spielskript in dieser Ansicht nicht. Bitte den Link im Browser öffnen.</p>
    </div>
  </div>
</div>
<div class="quer" id="quer" role="alert" hidden>
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="6" width="24" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="50" r="2.6" fill="currentColor"/><path d="M27 12h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
  <p>Bitte das Handy hochkant halten.</p>
  <small>Der Stammtisch tagt nur im Hochformat</small>
</div>
<script>
/* Fehler sichtbar machen (läuft auch, wenn ES-Module nicht laden) */
function zeigeFehler(m){const b=document.getElementById('best'),o=document.getElementById('ov');if(b)b.textContent='Fehler: '+m;if(o)o.hidden=false;}
window.addEventListener('error',e=>zeigeFehler(e.message||e));
window.addEventListener('unhandledrejection',e=>zeigeFehler((e.reason&&e.reason.message)||e.reason));
</script>
<script type="module" src="core/main.js"></script>
</body>
</html>
