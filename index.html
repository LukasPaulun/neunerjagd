<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Der Stammtisch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@800&family=Alegreya+Sans:wght@400;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
/* Layout: Handy-Hochformat – schmale Spalte, Spielfeld mit festem 9:16-Seitenverhältnis */
:root{
  --paper:#eef0ec; --surface:#f8f9f6; --ink:#1b1c1e; --muted:#5b625d; --line:#d3d8d0;
  --chestnut:#8c3b1f; --thorn:#3e5c33; --gold:#a8830f; --ok:#2f6b3a; --bad:#a3291c;
  --veil:rgba(248,249,246,.92);
  --f-display:"Grenze Gotisch",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141719; --surface:#1c2023; --ink:#ebe8e1; --muted:#9ca39f; --line:#2f3539;
  --chestnut:#d5764f; --thorn:#8fb27c; --gold:#e0bd4f; --ok:#7cc48a; --bad:#ef7b6c; --veil:rgba(28,32,35,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141719; --surface:#1c2023; --ink:#ebe8e1; --muted:#9ca39f; --line:#2f3539;
  --chestnut:#d5764f; --thorn:#8fb27c; --gold:#e0bd4f; --ok:#7cc48a; --bad:#ef7b6c; --veil:rgba(28,32,35,.92); color-scheme:dark}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-height:34px}
h1{font-family:var(--f-display);font-weight:800;margin:0;line-height:1;font-size:34px;color:var(--chestnut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}
.back{align-self:center;flex:none;position:relative;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.back::after{content:"";position:absolute;inset:-8px -4px}
.stage{position:relative;width:100%;width:min(100%,calc((100vh - 100px) * 9 / 16));width:min(100%,calc((100svh - 100px) * 9 / 16));margin:0 auto;aspect-ratio:9/16;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:28px;background:var(--veil)}
.overlay h2{font-family:var(--f-display);font-size:44px;margin:0;color:var(--chestnut);font-weight:800;line-height:1.05;text-wrap:balance}
.overlay p{margin:0;max-width:32ch}
.rules{font-size:14px;color:var(--muted)}
.big{background:var(--chestnut);color:#fff;border:0;padding:14px 30px;border-radius:999px;font:700 19px var(--f-body);cursor:pointer;touch-action:manipulation}
.best{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pause{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-mono);cursor:pointer;touch-action:manipulation}
/* Menü (Hub, Welle 1) */
.menu{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:26px 22px 150px;overflow:hidden}
.menu-head{text-align:center}
.menu-head h2{font-family:var(--f-display);font-size:40px;margin:0 0 6px;color:var(--chestnut);font-weight:800;line-height:1.05}
.menu-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.menu-item{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name station" "best best";gap:2px 10px;min-height:56px;padding:9px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--veil);color:var(--ink);text-decoration:none;touch-action:manipulation}
.menu-item.from{border-color:var(--chestnut)}
.mi-name{grid-area:name;font-weight:700;font-size:19px;line-height:1.2}
.mi-station{grid-area:station;align-self:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mi-best{grid-area:best;font-family:var(--f-mono);font-size:12px;color:var(--chestnut)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Der Stammtisch</h1>
    <span class="eyebrow" id="eyebrow">Stammtisch n.e.v.</span>
    <a class="back" id="back" href="#/" hidden>‹ Stammtisch</a>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Spielfeld"></canvas>
    <div id="hub" hidden></div>
    <button class="pause" id="pauseB" type="button" aria-label="Pause" hidden>II</button>
    <div class="overlay" id="ov">
      <h2 id="ov-t">Der Stammtisch</h2>
      <p id="ov-p"></p>
      <p class="rules" id="ov-r" hidden></p>
      <button class="big" id="start" type="button">Start</button>
      <p class="best" id="best">Falls diese Zeile stehen bleibt, läuft das Spielskript in dieser Ansicht nicht. Bitte den Link im Browser öffnen.</p>
    </div>
  </div>
</div>
<script>
/* Fehler sichtbar machen (läuft auch, wenn ES-Module nicht laden) */
function zeigeFehler(m){const b=document.getElementById('best'),o=document.getElementById('ov');if(b)b.textContent='Fehler: '+m;if(o)o.hidden=false;}
window.addEventListener('error',e=>zeigeFehler(e.message||e));
window.addEventListener('unhandledrejection',e=>zeigeFehler((e.reason&&e.reason.message)||e.reason));
</script>
<script type="module" src="core/main.js"></script>
</body>
</html>
